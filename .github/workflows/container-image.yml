name: Build verified EIP container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: eip-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/moxu09/qiunai-eip-runtime-20261022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Require a preconfigured private package before any build or push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://api.github.com/users/moxu09/packages/container/qiunai-eip-runtime-20261022', {
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' },
          });
          // Do not auto-create: a source-linked package may inherit public visibility.
          if (!response.ok || (await response.json()).visibility !== 'private')
            throw Error('An existing PRIVATE package is required; refusing to build or publish');
          NODE
      - name: Build and run all regression tests (no production admin secrets)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile.prebuilt
          load: true
          push: false
          platforms: linux/amd64
          tags: eip-smoke:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            APP_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start isolated container and verify pages, assets and auth guards
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          docker run --detach --name eip-smoke --publish 127.0.0.1:3000:3000 \
            --env NEXT_PUBLIC_SUPABASE_URL --env NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --env SUPABASE_SERVICE_ROLE_KEY=smoke-only-not-a-real-key \
            "eip-smoke:${GITHUB_SHA}"
          node scripts/container-smoke.mjs
          docker exec --env EXPECTED_REVISION eip-smoke node -e '
            const fs = require("node:fs");
            if (process.env.APP_REVISION !== process.env.EXPECTED_REVISION) throw Error("Wrong container revision");
            for (const path of ["assets/employment/contract-v1.1.pdf", "assets/employment/NotoSansCJKtc-Regular.otf", "assets/employment/deepnight-logo.png", "node_modules/@fontsource/noto-sans-tc/files/noto-sans-tc-chinese-traditional-400-normal.woff", "node_modules/@fontsource/noto-sans-tc/files/noto-sans-tc-chinese-traditional-700-normal.woff"])
              if (fs.statSync(path).size === 0) throw Error("Missing runtime asset");
            if (process.getuid() === 0) throw Error("Container must not run as root");
          '
          docker export --output "${RUNNER_TEMP}/eip-smoke.tar" eip-smoke
          tar -tf "${RUNNER_TEMP}/eip-smoke.tar" > "${RUNNER_TEMP}/eip-smoke-files.txt"
          if grep -Eq '(^|/)\.env(\.|$)' "${RUNNER_TEMP}/eip-smoke-files.txt"; then
            echo 'Unexpected environment file in runtime image'
            exit 1
          fi
      - name: Authenticate private container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified immutable revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker tag "eip-smoke:${GITHUB_SHA}" "${IMAGE}:sha-${GITHUB_SHA}"
          docker push "${IMAGE}:sha-${GITHUB_SHA}"
          test "$(gh api users/moxu09/packages/container/qiunai-eip-runtime-20261022 --jq .visibility)" = private
          printf '### Verified private container\n`%s:sha-%s`\n' "${IMAGE}" "${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
      - name: Show container log on failure
        if: failure()
        run: docker logs eip-smoke 2>/dev/null || true
      - name: Clean up smoke container
        if: always()
        run: docker rm --force eip-smoke 2>/dev/null || true
